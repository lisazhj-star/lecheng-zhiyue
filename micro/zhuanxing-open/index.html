    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      :root{
        --paper:#f4f1ea; --card:#fff; --ink:#0a0a0a; --ink2:#1f1f1f; --mute:#5a5a5a;
        --faint:#8c8c8c; --rule:#0a0a0a; --accent:#2541ee; --accent-soft:#2541ee1f;
        --serif-cn:"Noto Serif SC","Songti SC","STSong",serif;
        --sans-cn:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
        --mono:"JetBrains Mono","SF Mono",ui-monospace,monospace;
      }
      html,body{height:100%}
      body{background:var(--paper);color:var(--ink);font-family:var(--sans-cn);
        display:flex;align-items:center;justify-content:center;padding:32px;
        -webkit-font-smoothing:antialiased}
      .wrap{width:100%;max-width:760px;animation:rise .7s cubic-bezier(.2,.7,.3,1) both}
      @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
      .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--accent);
        text-transform:uppercase;margin-bottom:18px}
      h1{font-family:var(--serif-cn);font-size:clamp(34px,6.2vw,58px);line-height:1.14;
        letter-spacing:-.01em;margin-bottom:20px;font-weight:700}
      .lede{font-size:17px;line-height:1.85;color:var(--mute);max-width:600px;margin-bottom:30px}
      .rule{height:2px;background:var(--rule);opacity:.14;margin:0 0 30px}
      .meta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px}
      .tag{font-family:var(--mono);font-size:12px;letter-spacing:.06em;padding:7px 13px;
        border:1px solid rgba(10,10,10,.16);border-radius:999px;color:var(--ink2);background:rgba(255,255,255,.5)}
      .tag--key{background:var(--accent);border-color:var(--accent);color:#fff}
      .acts{display:flex;flex-wrap:wrap;gap:13px;align-items:center}
      .btn{appearance:none;border:1px solid var(--rule);background:var(--ink);color:#fff;
        font-family:var(--sans-cn);font-size:16px;font-weight:600;letter-spacing:.02em;
        padding:16px 30px;border-radius:999px;cursor:pointer;text-decoration:none;
        display:inline-flex;align-items:center;gap:9px;transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
      .btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(10,10,10,.18)}
      .btn--ghost{background:transparent;color:var(--ink);border-color:rgba(10,10,10,.3)}
      .btn--ghost:hover{background:rgba(10,10,10,.05);box-shadow:none}
      .btn__ico{font-family:var(--mono);font-size:13px;opacity:.75}
      .hint{margin-top:26px;font-family:var(--mono);font-size:12.5px;color:var(--faint);line-height:2}
      .hint b{color:var(--mute);font-weight:600}
      @media (max-width:560px){
        body{padding:24px 20px}
        .btn{width:100%;justify-content:center}
        .lede{font-size:16px}
      }
    </style>

      </p>
